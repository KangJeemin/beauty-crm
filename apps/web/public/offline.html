<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인터넷 연결 확인 · 미용 고객 관리</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4f2; color: #2a1f27;
         font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 18px; }
  main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { font-size: 1.5rem; margin: 1.2rem 0 0.6rem; }
  p { color: #6b5d66; line-height: 1.6; margin: 0 0 1.6rem; }
  button { width: 100%; min-height: 60px; border: 0; border-radius: 14px; background: #7a2e5f; color: #fff; font: inherit; font-weight: 800; font-size: 1.15rem; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>인터넷이 연결되지 않았어요</h1>
  <p>와이파이나 데이터가 켜져 있는지 확인해 주세요.<br>연결되면 아래 버튼을 눌러 주세요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
